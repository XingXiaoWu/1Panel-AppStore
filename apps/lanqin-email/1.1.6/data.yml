    - default: 995
      envKey: PANEL_APP_PORT_POP3S
      labelEn: "POP3S Port"
      labelZh: "POP3S Port"
      label:
        en: "POP3S Port"
        es-es: "POP3S Port"
        ja: "POP3S Port"
        ms: "POP3S Port"
        pt-br: "POP3S Port"
        ru: "POP3S Port"

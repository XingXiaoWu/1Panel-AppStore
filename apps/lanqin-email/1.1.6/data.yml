    - default: 993
      envKey: PANEL_APP_PORT_IMAPS
      labelEn: "IMAPS Port"
      labelZh: "IMAPS Port"
      label:
        en: "IMAPS Port"
        es-es: "IMAPS Port"
        ja: "IMAPS Port"
        ms: "IMAPS Port"
        pt-br: "IMAPS Port"
        ru: "IMAPS Port"
        ko: "IMAPS Port"
        zh-Hant: "IMAPS Port"
        zh: "IMAPS Port"
        tr: "IMAPS Port"
      required: true

services:
  gemini-web2api:
    image: ghcr.io/zexadev/gemini-web2api-go:latest
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8083"
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      TZ: "${TZ}"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - /app/gemini-web2api
        - "--version"
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      createdBy: Apps
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  1panel-network:
    external: true

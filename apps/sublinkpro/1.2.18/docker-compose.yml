services:
  sublinkpro:
    image: zerodeng/sublink-pro:v1.2.18
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8000"
    environment:
      SUBLINK_PORT: 8000
      SUBLINK_DSN: "${SUBLINK_DSN}"
      SUBLINK_LOG_LEVEL: "${SUBLINK_LOG_LEVEL}"
      SUBLINK_EXPIRE_DAYS: "${SUBLINK_EXPIRE_DAYS}"
      SUBLINK_CAPTCHA_MODE: "${SUBLINK_CAPTCHA_MODE}"
      SUBLINK_ADMIN_PASSWORD: "${SUBLINK_ADMIN_PASSWORD}"
      SUBLINK_WEB_BASE_PATH: "${SUBLINK_WEB_BASE_PATH}"
    volumes:
      - ./data/db:/app/db
      - ./data/template:/app/template
      - ./data/logs:/app/logs
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true

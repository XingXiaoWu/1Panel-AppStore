additionalProperties:
  formFields:
    - envKey: WAILS_PUBLISH_HOST
      default: 127.0.0.1
      labelEn: "Management Bind Address"
      labelZh: "管理面板绑定地址（面板无登录认证）"
      label:
        en: "Management Bind Address"
        es-es: "Dirección de enlace del panel (sin autenticación)"
        ja: "管理パネルのバインドアドレス（認証機能なし）"
        ms: "Alamat Ikatan Panel (tiada pengesahan)"
        pt-br: "Endereço de vinculação do painel (sem autenticação)"
        ru: "Адрес привязки панели (без аутентификации)"
        ko: "관리 패널 바인딩 주소(인증 없음)"
        zh-Hant: "管理面板繫結位址（面板無登入驗證）"
        zh: "管理面板绑定地址（面板无登录认证）"
        tr: "Panel Bağlantı Adresi (kimlik doğrulama yok)"

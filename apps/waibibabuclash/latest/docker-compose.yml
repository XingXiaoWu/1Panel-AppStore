services:
  waibibabuclash:
    image: waibibabuclash-server:linux-arm64
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      1panel-network:
        aliases:
          - "${PROXY_NETWORK_ALIAS}"
    ports:
      - "${WAILS_PUBLISH_HOST}:${PANEL_APP_PORT_HTTP}:8080"
    environment:
      WAILS_SERVER_HOST: 0.0.0.0
      WAILS_SERVER_PORT: 8080
      XDG_CONFIG_HOME: /data
    volumes:
      - ./data:/data
    labels:
      createdBy: Apps
    platform: linux/arm64
    pull_policy: never
    init: true
    stop_grace_period: 30s
networks:
  1panel-network:
    external: true
